[package]
name = "fcs-render"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "FCS Render Profile product codec and reference raster surface"

[dependencies]
fcs-fcbc = { path = "../fcs-fcbc" }
image = { workspace = true, features = ["png", "webp"] }
sha2.workspace = true
ttf-parser = { workspace = true, features = ["std"] }

[dev-dependencies]
fcs-model = { path = "../fcs-model" }
fcs-source = { path = "../fcs-source" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
