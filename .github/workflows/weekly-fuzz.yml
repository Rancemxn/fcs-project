name: Weekly fuzz

# Deep coverage-guided fuzzing of every hostile-input surface, 30 minutes per
# target, with the corpus grown across runs. This is a separate workflow from
# the ADR 0013 full gate and does not replace, shorten, or gate anything: the
# bounded smoke inside full-gate.yml remains the merge evidence.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - document_bytes
          - document_utf8
          - expression
          - fcbc_container
          - render_section
          - asset_image
          - asset_font
          - import_pgr
          - import_rpe
          - import_pec

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: cargo-bins/cargo-binstall@main

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          workspaces: |
            . -> target
            fuzz -> target

      - name: Install cargo-fuzz
        run: cargo binstall cargo-fuzz --secure --no-confirm

      - name: Restore grown corpus
        uses: actions/cache/restore@v4
        with:
          path: grown-corpus
          key: weekly-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            weekly-fuzz-corpus-${{ matrix.target }}-

      - name: Seed corpus from checked-in evidence
        run: python3 scripts/fcs5-fuzz-seeds.py . grown-corpus "${{ matrix.target }}"

      - name: Fuzz 30 minutes
        run: |
          cargo fuzz run --target "$(rustc --print host-tuple)" --sanitizer none \
            "${{ matrix.target }}" "grown-corpus/${{ matrix.target }}" -- \
            -max_total_time=1800 -max_len=65536 -timeout=30 -rss_limit_mb=4096 \
            -print_final_stats=1

      - name: Save grown corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: grown-corpus
          key: weekly-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
